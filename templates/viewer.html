<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern PDF Viewer</title>
    <!-- Include PDF.js from Stable CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .pdf-viewer-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Toolbar Styling */
        .pdf-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 24px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pdf-btn {
            background-color: #334155;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pdf-btn:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .pdf-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .pdf-input {
            background-color: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            width: 60px;
            text-align: center;
            border-radius: var(--radius);
            font-size: 14px;
        }

        .pdf-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .page-indicator {
            font-size: 14px;
            color: var(--text-muted);
            min-width: 60px;
            text-align: center;
        }

        /* Container & Canvas Viewport */
        #pdf-container {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px;
            gap: 20px;
            outline: none;
        }

        #pdf-container.single-page {
            flex-direction: column;
            align-items: center;
        }

        #pdf-container.dual-page {
            flex-direction: row;
            flex-wrap: wrap;
            align-content: flex-start;
        }

        #pdf-container canvas {
            max-width: 100%;
            height: auto !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            background-color: white;
        }

        @media (max-width: 768px) {
            .pdf-toolbar {
                padding: 8px 12px;
                justify-content: center;
            }
            #pdf-container {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- PDF Metadata Container injected by your Flask/Backend template engine -->
<div id="pdf-metadata" data-url="/get-pdf/KS3book.pdf" style="display:none;"></div>

    <div class="pdf-viewer-app">
        <header class="pdf-toolbar">
            <div class="toolbar-group">
                <button id="prev-btn" class="pdf-btn" title="Previous Page">❮ Prev</button>
                <span class="page-indicator">
                    <span id="page-num">1</span> / <span id="page-count">0</span>
                </span>
                <button id="next-btn" class="pdf-btn" title="Next Page">Next ❯</button>
            </div>

            <div class="toolbar-group" id="view-mode-section">
                <button id="single-view-btn" class="pdf-btn">Single</button>
                <button id="dual-view-btn" class="pdf-btn active">Dual</button>
            </div>

            <div class="toolbar-group">
                <input type="number" id="jump-input" class="pdf-input" min="1" value="1">
                <button id="jump-btn" class="pdf-btn">Go</button>
            </div>
        </header>

        <main id="pdf-container" class="dual-page" tabindex="0">
            Loading PDF…
        </main>
    </div>

    <!-- Viewer Application Logic Script -->
    <script>
        let pdfDoc = null;
        const isMobileViewport = window.matchMedia("(max-width: 768px)").matches;
        let isDualView = !isMobileViewport;

        const urlParams = new URLSearchParams(window.location.search);
        const targetPage = parseInt(urlParams.get('page'), 10);
        let pageNum = (!isNaN(targetPage) && targetPage > 0) ? targetPage : 1;

        const container = document.getElementById("pdf-container");
        if (container) {
            container.setAttribute("tabindex", "0");
            container.className = isDualView ? "dual-page" : "single-page";
        }

        const singleBtn = document.getElementById("single-view-btn");
        const dualBtn = document.getElementById("dual-view-btn");
        if (singleBtn) singleBtn.classList.toggle("active", !isDualView);
        if (dualBtn) dualBtn.classList.toggle("active", isDualView);

        const metaElement = document.getElementById("pdf-metadata");

        function showLoadError(stage, details) {
            console.error(`[${stage}]`, details);
            if (container) {
                container.innerHTML = `<div style="color: #ef4444; padding: 20px; text-align: center;"><strong>Error loading viewer (${stage}):</strong><br>${details.replace(/\n/g, '<br>')}</div>`;
            }
        }

        if (metaElement) {
            const pdfUrl = metaElement.getAttribute("data-url");

            if (!pdfUrl || pdfUrl === "None" || pdfUrl === "null") {
                showLoadError("viewer configuration", "No PDF URL was provided by the server.");
            } else {
                (async () => {
                    try {
                        const loadingTask = pdfjsLib.getDocument({ url: pdfUrl });
                        pdfDoc = await loadingTask.promise;

                        if (pageNum > pdfDoc.numPages) {
                            pageNum = pdfDoc.numPages;
                        }

                        const pageCountElem = document.getElementById("page-count");
                        if (pageCountElem) pageCountElem.textContent = pdfDoc.numPages;

                        renderPages();
                        if (container) container.focus();
                    } catch (err) {
                        const errorName = err instanceof Error ? err.name : "Error";
                        const errorMessage = err instanceof Error ? err.message : String(err);
                        const errorStack = err instanceof Error && err.stack ? `\n\nStack:\n${err.stack}` : "";
                        showLoadError(
                            "PDF.js parsing/loading",
                            `URL: ${new URL(pdfUrl, window.location.href).href}\n` +
                            `Browser: ${navigator.userAgent}\n` +
                            `${errorName}: ${errorMessage}${errorStack}`
                        );
                    }
                })();
            }
        }

        function renderPages() {
            if (!pdfDoc) return;
            container.innerHTML = "";

            renderSingleCanvas(pageNum);

            if (isDualView && pageNum + 1 <= pdfDoc.numPages) {
                renderSingleCanvas(pageNum + 1);
            }

            const pageNumElem = document.getElementById("page-num");
            if (pageNumElem) {
                pageNumElem.textContent = (isDualView && pageNum + 1 <= pdfDoc.numPages)
                    ? `${pageNum}-${pageNum + 1}`
                    : pageNum;
            }

            const jumpInput = document.getElementById("jump-input");
            if (jumpInput) jumpInput.value = pageNum;
        }

        function renderSingleCanvas(num) {
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");

                const outputScale = window.devicePixelRatio || 1;

                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                
                canvas.style.width = Math.floor(viewport.width) + "px";
                canvas.style.height = Math.floor(viewport.height) + "px";

                const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                container.appendChild(canvas);

                page.render({
                    canvasContext: ctx,
                    viewport: viewport,
                    transform: transform
                });
            });
        }

        function previousPage() {
            if (!pdfDoc || pageNum <= 1) return;
            pageNum -= isDualView ? 2 : 1;
            if (pageNum < 1) pageNum = 1;
            renderPages();
        }

        function nextPage() {
            if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
            const step = isDualView ? 2 : 1;
            if (pageNum + step <= pdfDoc.numPages) {
                pageNum += step;
            } else {
                pageNum = pdfDoc.numPages;
            }
            renderPages();
        }

        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        if (prevBtn) prevBtn.addEventListener("click", previousPage);
        if (nextBtn) nextBtn.addEventListener("click", nextPage);

        if (singleBtn) {
            singleBtn.addEventListener("click", e => {
                isDualView = false;
                container.className = "single-page";
                toggleActiveButton(e.target);
                renderPages();
            });
        }

        if (dualBtn) {
            dualBtn.addEventListener("click", e => {
                isDualView = true;
                container.className = "dual-page";
                toggleActiveButton(e.target);
                renderPages();
            });
        }

        function toggleActiveButton(target) {
            document.querySelectorAll("#view-mode-section button").forEach(button => button.classList.remove("active"));
            target.classList.add("active");
        }

        function executePageJump() {
            if (!pdfDoc) return;
            let targetPage = parseInt(document.getElementById("jump-input").value, 10);

            if (isNaN(targetPage) || targetPage < 1) targetPage = 1;
            if (targetPage > pdfDoc.numPages) targetPage = pdfDoc.numPages;

            pageNum = targetPage;
            document.getElementById("jump-input").value = pageNum;
            renderPages();
        }

        const jumpBtn = document.getElementById("jump-btn");
        const jumpInput = document.getElementById("jump-input");

        if (jumpBtn) jumpBtn.addEventListener("click", executePageJump);
        if (jumpInput) {
            jumpInput.addEventListener("keypress", e => {
                if (e.key === "Enter") executePageJump();
            });
        }

        document.addEventListener("keydown", e => {
            if (!pdfDoc) return;
            if (e.key === "ArrowLeft") {
                e.preventDefault();
                previousPage();
            }
            if (e.key === "ArrowRight") {
                e.preventDefault();
                nextPage();
            }
        });

        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener("touchstart", e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener("touchend", e => {
            touchEndX = e.changedTouches[0].screenX;
            if (!pdfDoc) return;

            const diff = touchStartX - touchEndX;
            const threshold = 60;

            if (Math.abs(diff) < threshold) return;

            if (diff > 0) {
                nextPage();
            } else {
                previousPage();
            }
        }, { passive: true });
    </script>
</body>
</html>
