<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lesson Notes Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Modern CSS Grid Layout Engine to lock viewport constraints */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            height: 100svh; /* Locks screen size dynamically behind iOS address bars */
            overflow: hidden;
            font-family: -apple-system, sans-serif;
            background-color: #525659;
            
            /* CSS Grid isolates the toolbar from the PDF scroll space completely */
            display: grid;
            grid-template-rows: auto 1fr; 
        }

        #toolbar {
            grid-row: 1; /* Always locked at the very top row */
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap; 
            gap: 10px;
            padding: 10px 15px;
            /* Extra safety padding for iPhones with modern notches/dynamic islands */
            padding-top: calc(10px + env(safe-area-inset-top, 0px)); 
            background-color: #2c3e50;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .nav-group, .action-group, .zoom-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #34495e;
            color: white;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent; 
        }

        button:active { background-color: #1a252f; }
        button.active { background-color: #007bff; }
        #back-dashboard-btn { background-color: #e74c3c; }

        #jump-input {
            width: 60px;
            text-align: center;
            padding: 8px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: white;
        }

        #page-info, #zoom-level {
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        #zoom-level {
            min-width: 45px;
            text-align: center;
        }

        /* The PDF element stays locked in its row and CANNOT overflow outward */
        #pdf-container {
            grid-row: 2; 
            width: 100%;
            height: 100%; /* Spans exactly the remaining height of the grid row */
            overflow: auto;
            -webkit-overflow-scrolling: touch; 
            display: block; 
            text-align: center;
            padding: 15px;
        }

        /* Pure CSS variable scaling on canvas elements directly */
        #pdf-container canvas {
            display: inline-block !important;
            width: calc(100% * var(--pdf-scale, 1)) !important;
            max-width: none !important;
            height: auto !important; 
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: width 0.15s ease-out;
        }
    </style>
</head>

<body>

<div id="toolbar">
    <div class="nav-group">
        <a href="{{ url_for('dashboard') }}" style="text-decoration: none;">
            <button id="back-dashboard-btn">🏠 Home</button>
        </a>
        <button id="prev-btn">◀ Prev</button>
        <button id="next-btn">Next ▶</button>
    </div>
    
    <div class="zoom-group">
        <button id="zoom-out-btn" title="Zoom Out">🔍−</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in-btn" title="Zoom In">🔍+</button>
        <button id="zoom-reset-btn" title="Reset Zoom">Reset</button>
    </div>

    <div class="action-group">
        <input type="number" id="jump-input" min="1" value="1" placeholder="Page">
        <button id="jump-btn">Go</button>
        
        <span id="view-mode-section">
            <button id="single-view-btn" class="active">1-Page</button>
            <button id="dual-view-btn">2-Page</button>
        </span>
    </div>
    
    <span id="page-info">Page <span id="page-num">1</span> of <span id="page-count">-</span></span>
</div>

    <div id="pdf-metadata" data-url="{{ pdf_url }}" style="display: none;"></div>

    <div id="pdf-container" class="single-page"></div>

    <script type="module" src="{{ url_for('static', filename='js/viewer.js') }}"></script>
    
    <!-- Safe CSS Variable-based Zoom Control -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentScale = 1.0;
            const step = 0.15;
            const minScale = 0.3;
            const maxScale = 2.5;

            const container = document.getElementById('pdf-container');
            const zoomDisplay = document.getElementById('zoom-level');

            function applyZoom(scale) {
                currentScale = Math.min(Math.max(scale, minScale), maxScale);
                container.style.setProperty('--pdf-scale', currentScale);
                if (zoomDisplay) {
                    zoomDisplay.innerText = `${Math.round(currentScale * 100)}%`;
                }
            }

            // Toolbar Button Bindings
            document.getElementById('zoom-in-btn')?.addEventListener('click', () => applyZoom(currentScale + step));
            document.getElementById('zoom-out-btn')?.addEventListener('click', () => applyZoom(currentScale - step));
            document.getElementById('zoom-reset-btn')?.addEventListener('click', () => applyZoom(1.0));

            // View Mode Syncing
            document.getElementById('dual-view-btn')?.addEventListener('click', () => {
                applyZoom(0.5); // Automatically sets zoom to 50% for 2-Page mode
            });

            document.getElementById('single-view-btn')?.addEventListener('click', () => {
                applyZoom(1.0); // Resets zoom to 100% for 1-Page mode
            });

            // Optional Ctrl + Mouse Wheel shortcut
            container.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    applyZoom(e.deltaY < 0 ? currentScale + step : currentScale - step);
                }
            }, { passive: false });
        });
    </script>
</body>
</html>
