<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lesson Notes Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            height: -webkit-fill-available; /* Fallback for iOS */
            height: 100svh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #525659;
            display: grid;
            grid-template-rows: auto 1fr; 
        }

        #toolbar {
            grid-row: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap; 
            gap: 10px;
            padding: 10px 15px;
            padding-top: calc(10px + env(safe-area-inset-top, 0px)); 
            background-color: #2c3e50;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .nav-group, .action-group, .zoom-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #34495e;
            color: white;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent; 
        }

        button:hover { background-color: #415b76; }
        button:active { background-color: #1a252f; }
        button.active { background-color: #007bff; }
        #back-dashboard-btn { background-color: #e74c3c; }
        #back-dashboard-btn:hover { background-color: #c0392b; }
        #print-btn { background-color: #27ae60; }
        #print-btn:hover { background-color: #219653; }

        #jump-input {
            width: 60px;
            text-align: center;
            padding: 8px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: white;
        }

        #page-info, #zoom-level {
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        #zoom-level {
            min-width: 45px;
            text-align: center;
        }

        #pdf-container {
            grid-row: 2; 
            width: 100%;
            height: 100%;
            overflow: auto;
            -webkit-overflow-scrolling: touch; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-start;
            gap: 15px;
            padding: 15px;
        }

        /* Responsive scaling for canvas */
        #pdf-container canvas {
            display: inline-block !important;
            width: calc(100% * var(--pdf-scale, 1)) !important;
            max-width: none !important;
            height: auto !important; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: width 0.15s ease-out;
        }

        /* 2-Page mode layout adjustments */
        #pdf-container.dual-page canvas {
            max-width: calc(50% - 10px) !important;
        }
    </style>
</head>

<body>

<div id="toolbar">
    <div class="nav-group">
        <a href="{{ url_for('dashboard') }}" style="text-decoration: none;">
            <button id="back-dashboard-btn">🏠 Home</button>
        </a>
        <button id="prev-btn">◀ Prev</button>
        <button id="next-btn">Next ▶</button>
    </div>
    
    <div class="zoom-group">
        <button id="zoom-out-btn" title="Zoom Out">🔍−</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in-btn" title="Zoom In">🔍+</button>
        <button id="zoom-reset-btn" title="Reset Zoom">Reset</button>
    </div>

    <div class="action-group">
        <input type="number" id="jump-input" min="1" value="1" placeholder="Page">
        <button id="jump-btn">Go</button>
        
        <span id="view-mode-section">
            <button id="single-view-btn" class="active">1-Page</button>
            <button id="dual-view-btn">2-Page</button>
        </span>

        <button id="print-btn" title="Print Current Page">🖨️ Print</button>

    </div>
    
    <span id="page-info">Page <span id="page-num">1</span> of <span id="page-count">-</span></span>
</div>

    <div id="pdf-metadata" data-url="{{ pdf_url }}" style="display: none;"></div>

    <div id="pdf-container" class="single-page"></div>

    <script type="module" src="{{ url_for('static', filename='js/viewer.js') }}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentScale = 1.0;
            const step = 0.15;
            const minScale = 0.3;
            const maxScale = 2.5;

            const container = document.getElementById('pdf-container');
            const zoomDisplay = document.getElementById('zoom-level');
            const singleBtn = document.getElementById('single-view-btn');
            const dualBtn = document.getElementById('dual-view-btn');
            const printBtn = document.getElementById('print-btn');

            let debounceTimer = null;

            function applyZoom(scale, skipDebounce = false) {
                currentScale = Math.min(Math.max(scale, minScale), maxScale);
                container.style.setProperty('--pdf-scale', currentScale);
                
                if (zoomDisplay) {
                    zoomDisplay.innerText = `${Math.round(currentScale * 100)}%`;
                }

                // Debounce full-resolution PDF.js re-render event
                clearTimeout(debounceTimer);
                if (!skipDebounce) {
                    debounceTimer = setTimeout(() => {
                        container.dispatchEvent(new CustomEvent('pdf-scale-change', {
                            detail: { scale: currentScale }
                        }));
                    }, 300);
                }
            }

            // Zoom Listeners
            document.getElementById('zoom-in-btn')?.addEventListener('click', () => applyZoom(currentScale + step));
            document.getElementById('zoom-out-btn')?.addEventListener('click', () => applyZoom(currentScale - step));
            document.getElementById('zoom-reset-btn')?.addEventListener('click', () => applyZoom(1.0));

            // View Mode Syncing
            dualBtn?.addEventListener('click', () => {
                container.classList.remove('single-page');
                container.classList.add('dual-page');
                singleBtn?.classList.remove('active');
                dualBtn?.classList.add('active');
                applyZoom(0.5);
            });

            singleBtn?.addEventListener('click', () => {
                container.classList.remove('dual-page');
                container.classList.add('single-page');
                dualBtn?.classList.remove('active');
                singleBtn?.classList.add('active');
                applyZoom(1.0);
            });

            // Print Current Page Handler
            printBtn?.addEventListener('click', () => {
                const canvas = container.querySelector('canvas');
                if (!canvas) return;

                const dataUrl = canvas.toDataURL('image/png');
                const printWindow = window.open('', '_blank');
                
                if (printWindow) {
                    printWindow.document.write(`
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>Print Page</title>
                            <style>
                                body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                                img { max-width: 100%; height: auto; }
                                @page { margin: 0; size: auto; }
                            </style>
                        </head>
                        <body>
                            <img src="${dataUrl}" onload="window.print(); window.close();" />
                        </body>
                        </html>
                    `);
                    printWindow.document.close();
                }
            });

            // Ctrl / Cmd + Wheel shortcut
            container.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    applyZoom(e.deltaY < 0 ? currentScale + step : currentScale - step);
                }
            }, { passive: false });
        });

// Print Current Page Handler
document.getElementById('print-btn')?.addEventListener('click', () => {
    const container = document.getElementById('pdf-container');
    const canvas = container ? container.querySelector('canvas') : null;
    if (!canvas) return;

    const dataUrl = canvas.toDataURL('image/png');
    const printWindow = window.open('', '_blank');
    
    if (printWindow) {
        printWindow.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>Print Page</title>
                <style>
                    body { 
                        margin: 0; 
                        display: flex; 
                        justify-content: center; 
                        align-items: center; 
                        min-height: 100vh; 
                    }
                    img { max-width: 100%; height: auto; }
                    @page { margin: 0; size: auto; }
                </style>
            </head>
            <body>
                <img src="${dataUrl}" onload="window.print(); window.close();" />
            </body>
            </html>
        `);
        printWindow.document.close();
    }
});

    </script>



</body>
</html>
